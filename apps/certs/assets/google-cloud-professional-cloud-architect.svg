<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1716 1323" role="img" aria-labelledby="title desc">
  <title id="title">Google Cloud Certified Professional Cloud Architect certificate</title>
  <desc id="desc">Certificate acknowledging Khanh Le as a Google Cloud Certified Professional Cloud Architect, issued February 20, 2026 and expiring February 20, 2028.</desc>
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .black{fill:#000}
      .gray{fill:#5f6368}
      .blue{fill:#4285f4}
      .red{fill:#ea4335}
      .yellow{fill:#fbbc05}
      .green{fill:#34a853}
    </style>
  </defs>

  <rect width="1716" height="1323" fill="#222"/>
  <rect x="15" y="7" width="1688" height="1309" fill="#fff"/>
  <rect x="44" y="35" width="1637" height="1241" fill="none" stroke="#dadce0" stroke-width="3"/>

  <g class="sans" font-weight="400">
    <text x="548" y="208" font-size="112" class="blue">G</text>
    <text x="632" y="208" font-size="94" class="red">o</text>
    <text x="697" y="208" font-size="94" class="yellow">o</text>
    <text x="762" y="208" font-size="94" class="blue">g</text>
    <text x="821" y="208" font-size="94" class="green">l</text>
    <text x="846" y="208" font-size="94" class="red">e</text>
    <text x="913" y="208" font-size="102" class="gray">Cloud</text>
  </g>

  <g class="sans black" text-anchor="middle">
    <text x="858" y="337" font-size="40">This acknowledges that</text>
    <text x="858" y="456" font-size="78">Khanh Le</text>
    <text x="858" y="552" font-size="40">has successfully completed all the requirements to be recognized as a</text>
    <text x="858" y="655" font-size="62">Google Cloud Certified</text>
    <text x="858" y="746" font-size="62">Professional Cloud Architect</text>
  </g>

  <g class="sans black" font-size="30">
    <text x="116" y="1028">Series ID: 121492</text>
    <text x="116" y="1075">Issued Date: Feb 20, 2026</text>
    <text x="116" y="1126">Expiration Date: Feb 20, 2028</text>
    <text x="116" y="1172">ID: f8878b96f2b541d7947df71a3fa2ec7e</text>
    <text x="116" y="1222">Certified As: </text>
    <text x="300" y="1222" font-weight="700">Khanh Le Vu Hoang</text>
  </g>

  <g transform="translate(758 934)">
