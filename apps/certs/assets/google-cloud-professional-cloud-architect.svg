    <text x="-23" y="238" class="sans gray" font-size="30">CEO, Google Cloud</text>
  </g>

  <g transform="translate(1457 1052)">
    <circle r="192" fill="#f8f9fa" stroke="#b5bcc3"/>
    <circle r="110" fill="none" stroke="#fbbc05" stroke-width="14"/>
    <path d="M-44 20c0-38 31-69 69-69 29 0 54 18 64 44h8c28 0 50 23 50 50s-22 50-50 50H-46c-30 0-54-24-54-54 0-28 21-51 48-54 2-2 5-5 8-7Z" fill="#4285f4"/>
    <path d="M24-49c29 0 54 18 64 44h8c8 0 15 2 22 5l-38 37c-10-19-30-32-56-32-26 0-48 17-56 40l-42-33c13-36 52-61 98-61Z" fill="#ea4335"/>
