    <text x="0" y="-7" class="white sans" font-size="30" font-weight="900" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="21" class="white sans" font-size="17" font-weight="800" text-anchor="middle">MuleSoft</text>
    <text x="0" y="42" class="white sans" font-size="17" font-weight="800" text-anchor="middle">Developer</text>
  </g>

  <text x="800" y="315" class="white sans wide" font-size="31" font-weight="800" text-anchor="middle">SALESFORCE CERTIFIED</text>
  <text x="800" y="390" class="white sans" font-size="48" font-weight="700" text-anchor="middle">MuleSoft Developer</text>
  <text x="800" y="552" class="white script" font-size="35" font-weight="700" text-anchor="middle">Presented to</text>
  <text x="800" y="603" class="white sans" font-size="31" font-weight="500" text-anchor="middle">Le Vu Hoang Khanh</text>
  <text x="800" y="666" class="white sans" font-size="28" font-weight="700" text-anchor="middle">for successfully completing certification requirements</text>

