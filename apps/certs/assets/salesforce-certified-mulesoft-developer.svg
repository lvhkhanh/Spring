<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Salesforce Certified MuleSoft Developer certificate</title>
  <desc id="desc">Certificate presented to Le Vu Hoang Khanh on June 18, 2022 with credential ID 4393063.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1477c9"/>
      <stop offset="1" stop-color="#0988de"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency=".9" numOctaves="2" seed="7" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
    </filter>
    <style>
      .white{fill:#fff}
      .muted{fill:#08285f}
      .sky{fill:#20a5df}
      .sky2{fill:#8fd0ff}
      .line{stroke:#9cc7ec;stroke-width:1.5}
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .script{font-family:"Brush Script MT","Segoe Script",cursive}
      .wide{letter-spacing:14px}
      .tiny{font-size:16px;font-weight:800;letter-spacing:6px}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f7f6"/>
  <path d="M0 0h1600v664c-247 55-510 85-800 85S247 719 0 664Z" fill="url(#blue)"/>
  <rect width="1600" height="735" fill="#0c7fd4" filter="url(#grain)" opacity=".45"/>

  <g opacity=".14" fill="#37c3ef">
    <circle cx="285" cy="150" r="98"/>
    <circle cx="118" cy="290" r="130"/>
    <circle cx="290" cy="286" r="150"/>
    <circle cx="505" cy="348" r="122"/>
    <circle cx="1375" cy="420" r="86"/>
    <circle cx="1518" cy="575" r="120"/>
    <circle cx="1205" cy="580" r="112"/>
    <circle cx="1030" cy="650" r="97"/>
