    <path d="M0 21c-28-8-42-20-50-43 24 3 40 14 50 43ZM9 7c-23-17-30-32-29-56 22 11 32 26 29 56ZM15-14c-12-23-13-39-4-60 16 16 21 32 4 60ZM-3 41c-29 1-46-6-61-25 24-5 43 1 61 25ZM-1 61c-26 10-45 9-65-6 22-12 42-10 65 6Z"/>
