    <path d="M-75 72-10 102c7 3 13 3 20 0l65-30-5 29-60 29c-7 4-13 4-20 0l-60-29Z" fill="#9db9ff"/>
    <g fill="#14a7db" transform="translate(0 -58)">
      <circle cx="-14" cy="2" r="13"/>
      <circle cx="0" cy="-6" r="13"/>
      <circle cx="15" cy="0" r="12"/>
      <circle cx="-25" cy="9" r="10"/>
      <circle cx="26" cy="3" r="11"/>
